name: pdfharbor
description: "PDFHarbor — a premium, all-in-one PDF toolkit for Android."
publish_to: 'none'

version: 1.0.3+010003

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^15.1.2

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Immutable models
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # PDF engine
  syncfusion_flutter_pdf: ^27.2.5
  syncfusion_flutter_pdfviewer: ^27.2.5
  pdfx: ^2.9.1

  # Scanner
  cunning_document_scanner: ^1.2.5

  # Images
  image_picker: ^1.1.2
  # Direct deps only so main.dart can flip on the Android Photo Picker; both
  # would otherwise come in transitively via image_picker.
  image_picker_android: ^0.8.13+17
  image_picker_platform_interface: ^2.11.1
  image_cropper: ^8.1.0
  image: ^4.3.0

  # Signature
  signature: ^5.5.0

  # Sharing / printing
  share_plus: ^10.1.4
  printing: ^5.13.4

  # File & path handling
  file_picker: ^8.3.7
  path_provider: ^2.1.5
  path: ^1.9.1

  # Permissions
  permission_handler: ^12.0.1

  # Theming
  dynamic_color: ^1.7.0

  # Animations
  flutter_animate: ^4.5.2
  animations: ^2.0.11
  shimmer: ^3.0.0

  # Misc utilities
  package_info_plus: ^8.1.2
  url_launcher: ^6.3.1
  intl: ^0.19.0
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  freezed: ^2.5.7
  json_serializable: ^6.9.0

flutter:
  uses-material-design: true

  assets:
    # Same source the Android launcher icons are generated from — one file,
    # so the in-app mark can never drift from the launcher icon.
    - images/app_logo.png

  # Bundled rather than fetched via google_fonts: the app works offline, and a
  # runtime download would leave the first launch rendering in Roboto.
  # Only the weights the type ramp actually asks for are shipped; Flutter fakes
  # any missing weight by synthesising it, which looks visibly wrong at w800.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
